name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  matrix-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        java: [11, 17, 21, 25]
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-java-${{ matrix.java }}
      cancel-in-progress: true
    env:
      DEFAULT_JAVA: 11

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-java@v5
      with:
        cache: maven
        distribution: temurin
        # Sonar plugin needs at least Java 17 at build time
        java-version: |
          ${{ matrix.java }}
          17
    - name: Build with Java ${{ matrix.java }}
      run: mvn --errors --batch-mode clean org.jacoco:jacoco-maven-plugin:prepare-agent install -DossindexSkip=true -Djava.version=${{ matrix.java }}
    - name: Sonar
      if: ${{ env.DEFAULT_JAVA == matrix.java && env.SONAR_TOKEN != null }}
      run: mvn --errors --batch-mode -Dsonar.token=$SONAR_TOKEN -DossindexSkip=true sonar:sonar
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  ossindex:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-java@v5
      with:
        cache: maven
        distribution: temurin
        java-version: 17
        server-id: ossindex
        server-username: OSSINDEX_USERNAME
        server-password: OSSINDEX_TOKEN
    - name: Ossindex
      if: ${{ env.OSSINDEX_USERNAME != null && env.OSSINDEX_TOKEN != null }}
      run: |
        mvn --errors --batch-mode test-compile -Djava.version=17 \
            org.sonatype.ossindex.maven:ossindex-maven-plugin:audit \
            org.sonatype.ossindex.maven:ossindex-maven-plugin:audit-aggregate
      env:
        OSSINDEX_USERNAME: ${{ secrets.OSSINDEX_USERNAME }}
        OSSINDEX_TOKEN: ${{ secrets.OSSINDEX_TOKEN }}

  build:
    needs:
      - matrix-build
      - ossindex
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - run: echo "Build successful"
